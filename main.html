<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Analyzer Pro | XAUUSD</title>
    <script src="https://unpkg.com/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #131722; color: #d1d4dc; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 320px; padding: 20px; background: #1e222d; border-right: 1px solid #2a2e39; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.3); overflow-y: auto; z-index: 10; }
        #chart-container { flex-grow: 1; position: relative; height: 100%; }
        .status-bar { position: absolute; top: 15px; left: 15px; z-index: 20; background: rgba(30, 34, 45, 0.9); padding: 8px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #2a2e39; pointer-events: auto; color: #fff; }
        .market-closed { color: #ef5350; font-weight: bold; }
        .market-open { color: #26a69a; font-weight: bold; }
        h3 { margin: 0 0 10px 0; color: #fff; font-size: 18px; }
        label { font-size: 11px; color: #8f98a3; text-transform: uppercase; }
        .btn-mode { background: #363c4e; color: #d1d4dc; border: 1px solid #434651; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 13px; text-align: left; transition: 0.2s; width: 100%; margin-bottom: 5px; }
        .btn-mode.active { border-color: #2962ff; background: rgba(41, 98, 255, 0.2); color: #fff; }
        .ai-btn { background: linear-gradient(45deg, #7b1fa2, #4a148c); color: white; border: none; padding: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }
        .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .calc-result { background: #2a2e39; padding: 15px; border-radius: 4px; border: 1px solid #363c4e; }
        .ai-box { background: #1e222d; padding: 15px; border-radius: 6px; font-size: 13px; line-height: 1.6; border: 1px solid #363c4e; margin-top: 10px; margin-bottom: 20px; height: auto !important; min-height: 80px; flex-shrink: 0; white-space: pre-wrap; word-wrap: break-word; overflow: visible; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; background: #2a2e39; border: 1px solid #363c4e; color: #fff; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 15px; text-align: center; outline: none; margin-top: 5px; }
        input:focus { border-color: #2962ff; background: #1e222d; }
        .astra-logo { position: absolute; bottom: 50px; left: 20px; z-index: 5; display: flex; align-items: center; gap: 10px; opacity: 0.2; pointer-events: none; transition: 0.3s; }
        .astra-logo img { height: 38px; width: auto; }
        .t-main { font-size: 16px; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .t-sub { font-size: 9px; color: #d1d4dc; margin-top: 3px; }
        .account-card { background: linear-gradient(135deg, #1e222d 0%, #161925 100%); border: 1px solid #2962ff; padding: 15px; border-radius: 8px; margin-top: 10px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
        .progress-bg { background: #363c4e; height: 6px; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; transition: 0.3s; }
        .risk-warn { color: #ef5350; font-size: 11px; margin-top: 5px; font-weight: bold; display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e222d; }
        ::-webkit-scrollbar-thumb { background: #363c4e; border-radius: 10px; border: 2px solid #1e222d; }
        #chart-container:hover .astra-logo { opacity: 0.5; }
        .astra-logo img { height: 38px; width: auto; }
        .astra-text { display: flex; flex-direction: column; line-height: 1; }
        .t-main { font-size: 16px; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .t-sub { font-size: 9px; color: #d1d4dc; margin-top: 3px; }
    </style>
</head>
<body>

<div id="chart-container">
    <div class="status-bar"> 
        <span id="symbol-text">XAU/USD</span> • 
        <select id="tf-select" onchange="window.currentTF = this.value; refreshData();" 
            style="background:#2a2e39; color:#2962ff; border:1px solid #363c4e; padding: 2px 5px; border-radius: 4px; font-weight:bold; cursor:pointer; outline:none; margin: 0 5px;">
            <option value="M15">M15</option>
            <option value="H1">H1</option>
            <option value="H4">H4</option>
        </select> • 
        <span id="status-text">ПОДКЛЮЧЕНИЕ...</span>
    </div>
    <div class="astra-logo">
        <img src="logo.svg" alt="Astra Logo">
        <div style="display:flex; flex-direction:column; line-height:1;">
            <span class="t-main">ASTRA</span>
            <span class="t-sub">ANALYZER PRO</span>
        </div>
    </div>
</div>

<div id="sidebar">
    <h3>Анализ Золота</h3>
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn-mode" id="btn-entry" onclick="setMode('entry')">📍 Установить Entry</button>
        <button class="btn-mode" id="btn-sl" onclick="setMode('sl')">🛑 Установить Stop Loss</button>
        <button class="btn-mode" id="btn-tp" onclick="setMode('tp')">🎯 Установить Take Profit</button>
    </div>
    <div class="account-card">
        <div class="stat-row"><span>Balance:</span> <strong id="acc-balance">$0.00</strong></div>
        <div class="stat-row"><span>Equity:</span> <strong id="acc-equity">$0.00</strong></div>
        <div class="progress-bg"><div id="daily-bar" class="progress-fill" style="width: 0%; background: #26a69a;"></div></div>
        <div id="drawdown-warn" class="risk-warn">⚠️ ПРЕДЕЛ ПРОСАДКИ БЛИЗКО!</div>
    </div>
    <hr style="width:100%; border:0; border-top:1px solid #363c4e; margin: 10px 0;">
    <div><label>Entry Price</label><input type="number" id="input-entry" step="0.01" oninput="calculateSetup()"></div>
    <div><label>Stop Loss</label><input type="number" id="input-sl" step="0.01" oninput="calculateSetup()"></div>
    <div><label>Take Profit</label><input type="number" id="input-tp" step="0.01" oninput="calculateSetup()"></div>
    <div class="calc-result">
        <div style="display: flex; justify-content: space-between;"><span>R:R Ratio:</span> <strong id="rrValue">-</strong></div>
        <div style="display: flex; justify-content: space-between;"><span>Риск:</span> <strong id="riskPoints">-</strong></div>
    </div>
    <button onclick="askAI()" id="ai-btn" class="ai-btn">Анализ AI</button>
    <div id="aiResponse" class="ai-box">Установите уровни на графике.</div>
</div>

<script>
    const API_BASE = "http://127.0.0.1:5000";
    
    // Глобальные переменные
    let config = {};
    let currentBalance = 0;
    let currentEquity = 0;
    let currentHistory = [];
    let aiContextData = {};
    window.currentTF = "M15";

    // Инициализация графика
    const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
        timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2b2b43' }
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, 
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
    });

    // Загрузка конфигурации
    async function loadConfig() {
        try {
            const response = await fetch(`${API_BASE}/api/market/config`);
            const data = await response.json();
            if (!data.error) {
                config = data;
                currentBalance = data.start_balance;
                currentEquity = data.start_balance;
                document.getElementById('symbol-text').innerText = data.symbol || 'XAU/USD';
                document.getElementById('acc-balance').innerText = `$${data.start_balance.toFixed(2)}`;
                document.getElementById('acc-equity').innerText = `$${data.start_balance.toFixed(2)}`;
            }
        } catch (e) {
            console.error('Failed to load config:', e);
        }
    }

    // Обновление данных графика
    async function refreshData() {
        try {
            // Определяем лимит свечей в зависимости от таймфрейма
            const limit = window.currentTF === 'H4' ? 50 : 200;
            
            // Получаем данные свечей для текущего таймфрейма
            const response = await fetch(`${API_BASE}/api/market/candles?tf=${window.currentTF}&limit=${limit}`);
            const data = await response.json();
            
            if (data.error) { 
                document.getElementById('status-text').innerText = "API OFFLINE"; 
                return; 
            }
            
            // Обрабатываем данные свечей
            if (data.candles && data.candles.length > 0) {
                // Yahoo Finance уже возвращает правильный timestamp
                const formatted = data.candles.map(d => ({ 
                    time: d.time,
                    open: d.open, 
                    high: d.high, 
                    low: d.low, 
                    close: d.close 
                }));
                candleSeries.setData(formatted);
                currentHistory = formatted;
            }
            
            updateMarketStatusUI();
            updateRiskBar();
            
        } catch (e) { 
            console.error('Refresh error:', e);
            document.getElementById('status-text').innerText = "SERVER OFFLINE"; 
        }
    }

    // Загрузка AI контекста (вызывается только перед анализом)
    async function loadAIContext() {
        try {
            // Получаем данные по всем таймфреймам для AI
            const response = await fetch(`${API_BASE}/api/market/candles`);
            const data = await response.json();
            
            if (data.error || !data.timeframes) {
                console.error('Failed to load AI context');
                return {};
            }
            
            // Преобразуем в формат для AI (только H, L, C)
            const context = {};
            for (const [tf, tfData] of Object.entries(data.timeframes)) {
                context[tf] = tfData.candles.map(c => ({
                    h: c.high,
                    l: c.low,
                    c: c.close
                }));
            }
            
            return context;
        } catch (e) {
            console.error('AI context error:', e);
            return {};
        }
    }

    // Обновление полосы риска
    function updateRiskBar() {
        if (!config.start_balance || !config.daily_loss_limit) return;
        
        const dailyLoss = Math.max(0, config.start_balance - currentEquity);
        const percent = Math.min(100, (dailyLoss / config.daily_loss_limit) * 100);
        const bar = document.getElementById('daily-bar');
        
        bar.style.width = percent + "%";
        bar.style.background = percent > 80 ? "#ef5350" : (percent > 50 ? "#fb8c00" : "#26a69a");
        
        const warnThreshold = config.start_balance - (config.daily_loss_limit * 0.9);
        document.getElementById('drawdown-warn').style.display = 
            (currentEquity <= warnThreshold) ? "block" : "none";
    }

    // Статус рынка
    function updateMarketStatusUI() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const astNow = new Date(utc + (3600000 * 4));
        const day = astNow.getDay(), hour = astNow.getHours();
        
        let isOpen = true;
        if ((day === 6 && hour >= 2) || day === 0 || (day === 1 && hour < 3)) {
            isOpen = false;
        }
        
        const el = document.getElementById('status-text');
        el.innerText = isOpen ? "РЫНОК ОТКРЫТ" : "РЫНОК ЗАКРЫТ";
        el.className = isOpen ? "market-open" : "market-closed";
    }

    // Режимы установки уровней
    let activeMode = null, entryLine, slLine, tpLine;
    
    function setMode(m) {
        activeMode = m;
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
    }

    chart.subscribeClick(param => {
        if (!param.point || !activeMode) return;
        const price = candleSeries.coordinateToPrice(param.point.y);
        document.getElementById('input-' + activeMode).value = price.toFixed(2);
        calculateSetup();
    });

    // Отрисовка линий
    function drawLines(entry, sl, tp) {
        if (entryLine) candleSeries.removePriceLine(entryLine);
        if (slLine) candleSeries.removePriceLine(slLine);
        if (tpLine) candleSeries.removePriceLine(tpLine);
        
        if (entry) entryLine = candleSeries.createPriceLine({ 
            price: entry, color: '#2962ff', lineWidth: 2, lineStyle: 2, title: 'ENTRY' 
        });
        if (sl) slLine = candleSeries.createPriceLine({ 
            price: sl, color: '#ef5350', lineWidth: 2, title: 'SL' 
        });
        if (tp) tpLine = candleSeries.createPriceLine({ 
            price: tp, color: '#26a69a', lineWidth: 2, title: 'TP' 
        });
    }

    // Расчет через backend API
    async function calculateSetup() {
        const entry = parseFloat(document.getElementById('input-entry').value.replace(',', '.'));
        const sl = parseFloat(document.getElementById('input-sl').value.replace(',', '.'));
        const tp = parseFloat(document.getElementById('input-tp').value.replace(',', '.'));
        
        drawLines(entry, sl, tp);
        
        if (!entry || !sl || !tp) {
            document.getElementById('rrValue').innerText = '-';
            document.getElementById('riskPoints').innerText = '-';
            return;
        }
        
        try {
            const response = await fetch(`${API_BASE}/api/analysis/calculate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ entry, sl, tp, balance: currentBalance })
            });
            
            const data = await response.json();
            
            if (data.error) {
                console.error('Calculate error:', data.error);
                return;
            }
            
            document.getElementById('rrValue').innerText = `1 : ${data.rr_ratio}`;
            
            const lotColor = data.lot > 0 ? "#26a69a" : "#ef5350";
            document.getElementById('riskPoints').innerHTML = 
                `${data.stop_points} pts | <span style="color:${lotColor}; font-weight:bold;">Lot: ${data.lot.toFixed(2)}</span>`;
                
        } catch (e) {
            console.error('Failed to calculate:', e);
        }
    }

    // AI анализ через backend
    async function askAI() {
        const aiDiv = document.getElementById('aiResponse');
        const aiBtn = document.getElementById('ai-btn');
        const entry = document.getElementById('input-entry').value;
        const sl = document.getElementById('input-sl').value;
        const tp = document.getElementById('input-tp').value;
        
        if (!entry || !sl || !tp) {
            aiDiv.innerText = "Сначала установите уровни на графике!";
            return;
        }
        
        aiDiv.style.color = "#d1d4dc";
        aiDiv.innerText = "AI анализирует...";
        aiBtn.disabled = true;
        
        try {
            // Получаем расчет лота для передачи в анализ
            const calcResponse = await fetch(`${API_BASE}/api/analysis/calculate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    entry: parseFloat(entry), 
                    sl: parseFloat(sl), 
                    tp: parseFloat(tp), 
                    balance: currentBalance 
                })
            });
            const calcData = await calcResponse.json();
            
            // Загружаем AI контекст
            const aiContext = await loadAIContext();
            
            // Запрос AI анализа
            const response = await fetch(`${API_BASE}/api/analysis/analyze`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    entry,
                    sl,
                    tp,
                    balance: currentBalance,
                    equity: currentEquity,
                    lot: calcData.lot || 0,
                    ai_context: aiContext
                })
            });
            
            const data = await response.json();
            
            if (response.status === 429) {
                aiDiv.innerText = "ЛИМИТ ЗАПРОСОВ AI.";
            } else if (data.error) {
                aiDiv.innerText = `Ошибка: ${data.error}`;
            } else if (data.analysis) {
                aiDiv.innerText = data.analysis;
            } else {
                aiDiv.innerText = "Некорректный ответ от AI";
            }
            
        } catch (e) {
            aiDiv.innerText = "Ошибка связи с сервером. Проверьте соединение.";
            console.error('AI Error:', e);
        } finally {
            aiBtn.disabled = false;
        }
    }

    // Адаптивность
    window.addEventListener('resize', () => {
        chart.resize(
            document.getElementById('chart-container').clientWidth, 
            window.innerHeight
        );
    });

    // Инициализация
    (async function init() {
        await loadConfig();
        await refreshData();
    })();
</script>
</body>
</html>
